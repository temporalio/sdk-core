syntax = "proto3";

package temporal.api.stream.v1;

option go_package = "go.temporal.io/api/stream/v1;stream";
option java_package = "io.temporal.api.stream.v1";
option java_multiple_files = true;
option java_outer_classname = "MessageProto";
option ruby_package = "Temporalio::Api::Stream::V1";
option csharp_namespace = "Temporalio.Api.Stream.V1";

import "google/protobuf/timestamp.proto";

import "temporal/api/common/v1/message.proto";
import "temporal/api/enums/v1/stream.proto";
import "temporal/api/failure/v1/message.proto";

// Experimental. Might change in the future.
// Identifies one Stream. The id is opaque to callers.
message StreamHandle {
    string id = 1;
    // Unset for a standalone Stream. For a Stream bound to a Workflow, business_id is the Workflow
    // ID and run_id is the first execution run id of its run chain. For a Standalone Activity,
    // business_id is the activity ID and run_id is its run id. A create and a close of a
    // Workflow-owned Stream must name its owner.
    temporal.api.common.v1.Execution owner = 2;
    // The name of the backend that holds the Stream, as the Worker and client config register
    // it, so every process routes a handle it receives. Empty is the default backend. The Store
    // never reads it.
    string backend = 3;
}

// Experimental. Might change in the future.
// The ordered attempt of a Producer. A higher epoch supersedes the Records of a lower epoch of the
// same Producer. Epochs compare field by field, in the order of the field numbers. Each kind sets
// only its own fields. A field that a kind does not use is empty and compares as zero.
message ProducerEpoch {
    // Workflow and Local Activity. The started event id of the Workflow Task of a Workflow, or of
    // the Workflow Task that dispatched a Local Activity.
    int64 task_started_event_id = 1;
    // Workflow and Local Activity. The attempt of that Workflow Task.
    int32 task_attempt = 2;
    // Workflow and Local Activity. When that Workflow Task attempt started. It tells a reused
    // started event id apart, for example after a dropped speculative task.
    google.protobuf.Timestamp task_started_time = 3;
    // Activity and Standalone Activity. When the server scheduled this attempt. An Activity reset
    // starts the attempt count again, so only this time orders the attempts across a reset. A
    // Local Activity or a client has no attempt that the server schedules.
    google.protobuf.Timestamp attempt_scheduled_time = 4;
    // Activity, Standalone Activity, Local Activity and client. The Producer's own attempt. For a
    // Local Activity it counts the retries of the Local Activity, and task_attempt counts the
    // attempts of the Workflow Task that dispatched it.
    int32 attempt = 5;
}

// Experimental. Might change in the future.
// The code that wrote a batch. Its id stays the same across attempts, and its epoch orders them.
message Producer {
    temporal.api.enums.v1.StreamProducerKind kind = 1;
    // Stable across attempts, such as `wf:<run id>` for the Workflow Producer of a run.
    string id = 2;
    ProducerEpoch epoch = 3;
    // The run of the Producer, so nobody parses the id. Empty for a client.
    string run_id = 4;
}

// Experimental. Might change in the future.
// One Workflow Task attempt of a run. The withdrawal facts name the run's last completed task
// with it.
message WorkflowTaskEpoch {
    int64 started_event_id = 1;
    int32 attempt = 2;
    google.protobuf.Timestamp started_time = 3;
}

// Experimental. Might change in the future.
// One Record of a batch to append. The Store adds the batch's Producer and an offset.
message AppendRecord {
    temporal.api.common.v1.Payload body = 1;
}

// Experimental. Might change in the future.
// Which earlier Records a retried Producer withdraws. The Store keeps these facts for the first
// batch of a higher epoch, or for a retry run's first write, and a read builds a Superseded item
// from them. A reader drops the earlier Records that the facts name.
message StreamSuperseded {
    // The kind of the Producer that withdraws.
    temporal.api.enums.v1.StreamProducerKind producer_kind = 1;
    // The id of the Producer that withdraws.
    string producer_id = 2;
    // The epoch of the Producer that withdraws. Its lower epochs are withdrawn.
    ProducerEpoch epoch = 3;
    // Workflow only. The run's last completed Workflow Task.
    WorkflowTaskEpoch previous_completed_task = 4;
    // Workflow only. The started event ids of the run's failed or timed out Workflow Tasks.
    repeated int64 failed_tasks = 5;
    // Workflow retry only. The previous run. Every Record whose Producer carries it is withdrawn.
    string withdraw_run = 6;
    // The run of the Producer, so nobody parses the id. Empty for a client.
    string run_id = 7;
}

// Experimental. Might change in the future.
// One Record that a Producer appended.
message StreamData {
    Producer producer = 1;
    temporal.api.common.v1.Payload body = 2;
}

// Experimental. Might change in the future.
// The close of a Stream. A Stream has at most one, and a read returns it last.
message StreamClose {
    // The Producer that closed the Stream.
    Producer producer = 1;
    temporal.api.common.v1.Payload result = 2;
    temporal.api.failure.v1.Failure failure = 3;
    // How the Stream closed, so a reader doesn't parse the failure.
    temporal.api.enums.v1.StreamCloseStatus status = 4;
}

// Experimental. Might change in the future.
// An offset is ordered and unique in one Stream, and it is sparse. Offsets have gaps, so they
// don't count Records. Zero is never an offset. A read names its Stream, so the read checks the
// offset against that Stream.
message StreamRecord {
    int64 offset = 1;
    // A read item is a Record, a Superseded item or the close.
    oneof item {
        StreamData data = 2;
        // The Store keeps only the withdrawal facts of the first batch of a higher epoch. A read
        // builds this item from them. It withdraws the earlier Records that the facts name, and a
        // reader drops them.
        StreamSuperseded superseded = 3;
        StreamClose close = 4;
    }
}

// Experimental. Might change in the future.
// The details of a failed Stream call, in the gRPC status details and in the details of the
// application failure of a Nexus operation.
message StreamErrorDetails {
    temporal.api.enums.v1.StreamErrorReason reason = 1;
}
